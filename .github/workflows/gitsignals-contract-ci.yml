name: GitSignals public encrypted-contract smoke
on:
  push:
    branches: [main]
    paths:
      - 'contracts/request.schema.json'
      - 'examples/envelope.shape.json'
      - '.github/workflows/gitsignals-contract-ci.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contract-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify .NET 8 SDK is available (no private source)
        shell: bash
        run: dotnet --list-sdks
      - name: Validate encrypted envelope schema (no secrets or private source)
        shell: python
        run: |
          import json
          from pathlib import Path
          schema = json.loads(Path('contracts/request.schema.json').read_text(encoding='utf-8'))
          example = json.loads(Path('examples/envelope.shape.json').read_text(encoding='utf-8'))
          required = set(schema['required'])
          assert set(example) == required
          assert schema['additionalProperties'] is False
          assert example['schema'] == 'mainalto.gitsignals.envelope/2'
          assert example['algorithm'] == 'RSA-OAEP-256+A256GCM'
          assert set(['chat', 'objective', 'operation', 'model', 'capability']).isdisjoint(example)
          assert all(example[x].startswith('<') for x in ('key_id', 'wrapped_key', 'nonce', 'tag', 'ciphertext'))
          assert not Path('examples/request.example.json').exists()
          assert not Path('keys/private.pem').exists()
          print('GITSIGNALS_ENVELOPE_CONTRACT=PASS PUBLIC_ONLY=1 MODEL_CALLS=0 UIA_SENDS=0')
