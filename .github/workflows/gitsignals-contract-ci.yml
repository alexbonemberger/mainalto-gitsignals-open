name: GitSignals public contract smoke
on:
  push:
    branches: [main]
    paths:
      - 'contracts/request.schema.json'
      - 'examples/request.example.json'
      - '.github/workflows/gitsignals-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-contract-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify .NET 8 SDK is available (no private source)
        shell: bash
        run: dotnet --list-sdks
      - name: Validate JSON contract and non-dispatching example
        shell: python
        run: |
          import json
          from pathlib import Path
          schema = json.loads(Path('contracts/request.schema.json').read_text(encoding='utf-8'))
          example = json.loads(Path('examples/request.example.json').read_text(encoding='utf-8'))
          fields = set(schema['required'])
          assert set(example) == fields
          assert example['schema'] == schema['properties']['schema']['const']
          assert example['operation'] == 'capability.propose'
          assert example['model'] == 'qwen3-vl:2b-instruct'
          assert example['chat'] == 'REPLACE_WITH_REGISTERED_CHAT_ALIAS'
          assert not any(s in json.dumps(example).lower() for s in ['password', 'token='])
          print('GITSIGNALS_PUBLIC_CONTRACT=PASS SOURCE_EXECUTIONS=0 UIA=0 OLLAMA=0')
